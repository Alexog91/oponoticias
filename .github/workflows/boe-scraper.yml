name: Leer BOE automáticamente

on:
  schedule:
    - cron: '0 9 * * *'  # Se ejecuta cada día a las 9:00 AM UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Ejecutar script del BOE
      run: python3 leer_boe.py
    
    - name: Guardar cambios en el repositorio
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add convocatorias.csv
        git commit -m "Actualizar convocatorias - $(date '+%Y-%m-%d %H:%M:%S')" || echo "Sin cambios"
        git push
