name: Leer BOE automáticamente

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Ejecutar script del BOE
      run: python3 leer_boe.py
    
    - name: Commit y Push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Actualizar convocatorias BOE"
        file_pattern: convocatorias.csv
